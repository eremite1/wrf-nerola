name: "Sentinella WRF"
run-name: "Sentinella WRF"

# GitHub fa partire gli avvii a orario anche con molte ore di ritardo. Questa sentinella resta accesa (circa 5 ore e
# 45 minuti, poi riparte da sola) e ogni 15 minuti controlla se ECMWF ha pubblicato una corsa piu' nuova di quella
# dell'ultima previsione: se si', e se il WRF non sta gia' girando, lo fa partire subito.
on:
  schedule:
    - cron: "41 */2 * * *"     # solo riserva, se la catena si interrompe
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sentinella.yml"]

permissions:
  contents: read
  actions: write

concurrency:
  group: sentinella
  cancel-in-progress: false

jobs:
  guarda:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Controllo ogni 15 minuti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-requests python3-numpy >/dev/null
          git clone -q --depth 1 https://github.com/eremite1/meteo-mappe /tmp/meteo-mappe || true
          INIZIO=$(date +%s)
          while [ $(( ($(date +%s) - INIZIO) / 60 )) -lt 340 ]; do
            NUOVA=$(python3 scarica_ecmwf.py --trova --ore 72 2>/dev/null | tail -n 1 || true)
            FATTA=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/risultati/LEGGIMI.md" 2>/dev/null \
                    | grep -o '[0-9]\{10\}' | head -n 1 || true)
            ELENCO=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow previsione-nerola.yml --limit 20 --json status,displayTitle \
                     --jq '.[] | select(.status != "completed") | .displayTitle' 2>/dev/null || true)
            ATTIVI=$(printf '%s\n' "$ELENCO" | grep -c . || true)
            IN_CORSO=$(printf '%s\n' "$ELENCO" | grep -o '[0-9]\{10\}' | sort -n | tail -n 1 || true)
            echo "$(date -u +%H:%M) ECMWF disponibile: ${NUOVA:-?}, online: ${FATTA:-?}, in calcolo: ${IN_CORSO:--} (corse attive: $ATTIVI)"
            # ogni nuova corsa ECMWF parte subito (fino a 2 insieme): il calcolo dura piu' di 6 ore
            if [ -n "$NUOVA" ] && [ "$NUOVA" -gt "${FATTA:-0}" ] 2>/dev/null && [ "$NUOVA" -gt "${IN_CORSO:-0}" ] 2>/dev/null && [ "$ATTIVI" -lt 2 ]; then
              echo "  -> faccio partire il WRF con la corsa $NUOVA"
              gh workflow run previsione-nerola.yml --repo "$GITHUB_REPOSITORY" --ref main -f ore=72 -f ore_blocco=24 -f corsa="$NUOVA" || true
              sleep 120
            fi
            # altre catene (333 m, GFS, ICON-EU, ICON-2I): parte ognuna quando esce una corsa nuova del suo modello
            for c in fine gfs iconeu icon2i; do
              case "$c" in
                fine) DISP=$(python3 scarica_ecmwf.py --trova --ore 36 2>/dev/null | tail -n 1);;
                gfs)  DISP=$(python3 scarica_gfs.py --trova --ore 48 2>/dev/null | tail -n 1);;
                *)    DISP=$(MOTORE_MAPPE=/tmp/meteo-mappe python3 intermedio_icon.py --modello "$c" --trova --ore 48 2>/dev/null | tail -n 1);;
              esac
              FATTA_C=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/risultati/$c/LEGGIMI.md" 2>/dev/null \
                        | grep -o '[0-9]\{10\}' | head -n 1 || true)
              ATT_C=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow previsione-catena.yml --limit 20 --json status,displayTitle \
                      --jq ".[] | select(.status != \"completed\") | select(.displayTitle | startswith(\"Catena $c \")) | .displayTitle" 2>/dev/null | grep -c . || true)
              echo "   catena $c: disponibile ${DISP:-?}, online ${FATTA_C:-?}, in calcolo $ATT_C"
              case "$DISP" in [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;; *) continue;; esac
              if [ "$DISP" -gt "${FATTA_C:-0}" ] 2>/dev/null && [ "$ATT_C" -eq 0 ]; then
                echo "  -> faccio partire la catena $c con la corsa $DISP"
                gh workflow run previsione-catena.yml --repo "$GITHUB_REPOSITORY" --ref main -f catena="$c" -f corsa="$DISP" || true
              fi
            done
            sleep 900
          done
      - name: Riparto
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sentinella.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "riavvio non riuscito: ci pensa la riserva"
