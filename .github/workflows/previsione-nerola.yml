name: "Previsione Nerola"
run-name: "Previsione Nerola ${{ inputs.ore }} h (blocchi da ${{ inputs.ore_blocco }}) ${{ inputs.corsa }}"

# Previsione WRF a 3 km e 1 km su Nerola, con dati ECMWF IFS 0,1 gradi.
# 1) prepara: scarica i dati, li prepara per WRF (WPS) e crea le condizioni iniziali e al contorno (real.exe)
# 2) blocchi da 24 ore: WRF su ARM, ogni blocco riparte dal precedente
# 3) pubblica: controllo di plausibilita', mappe e meteogramma nel ramo "risultati"
on:
  workflow_dispatch:
    inputs:
      ore:
        description: "Ore di previsione (6 e 12 solo per le prove)"
        type: choice
        options: ["6", "12", "24", "48", "72"]
        default: "24"
      ore_blocco:
        description: "Ore per ogni blocco (24 normalmente; 3 solo per provare la ripartenza con 6 ore)"
        type: choice
        options: ["24", "12", "6", "3"]
        default: "24"
      corsa:
        description: "Corsa ECMWF AAAAMMGGHH (vuoto = l'ultima disponibile)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: previsione-nerola
  cancel-in-progress: false

jobs:
  dati:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      corsa: ${{ steps.scelta.outputs.corsa }}
      n: ${{ steps.blocchi.outputs.n }}
      b1: ${{ steps.blocchi.outputs.b1 }}
      b2: ${{ steps.blocchi.outputs.b2 }}
      b3: ${{ steps.blocchi.outputs.b3 }}
    env:
      ORE: ${{ inputs.ore }}
    steps:
      - uses: actions/checkout@v4

      - name: Quanti blocchi servono
        id: blocchi
        env:
          BL: ${{ inputs.ore_blocco }}
        run: |
          [ $((ORE % BL)) -eq 0 ] || { echo "ERRORE: le ore ($ORE) devono essere un multiplo delle ore del blocco ($BL)"; exit 1; }
          N=$((ORE / BL))
          { [ "$N" -ge 1 ] && [ "$N" -le 3 ]; } || { echo "ERRORE: servirebbero $N blocchi, ne sono ammessi da 1 a 3"; exit 1; }
          echo "$N blocchi da $BL ore"
          { echo "n=$N"; echo "b1=$BL"; echo "b2=$((2 * BL))"; echo "b3=$((3 * BL))"; } >> "$GITHUB_OUTPUT"

      - name: Programmi necessari
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cdo libeccodes-tools python3-requests

      - name: Scelgo la corsa ECMWF
        id: scelta
        env:
          CORSA_IN: ${{ inputs.corsa }}
        run: |
          case "$CORSA_IN" in
            ""|[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "ERRORE: la corsa va scritta AAAAMMGGHH, per esempio 2026102400"; exit 1;;
          esac
          if [ -n "$CORSA_IN" ]; then
            C=$(python3 scarica_ecmwf.py --trova --ore "$ORE" --corsa "$CORSA_IN")
          else
            C=$(python3 scarica_ecmwf.py --trova --ore "$ORE")
          fi
          echo "CORSA SCELTA: $C (previsione di $ORE ore)"
          echo "corsa=$C" >> "$GITHUB_OUTPUT"
          echo "CORSA=$C" >> "$GITHUB_ENV"

      - name: Scarico i dati ECMWF (solo i campi che servono)
        run: |
          python3 scarica_ecmwf.py --corsa "$CORSA" --ore "$ORE" --out /home/runner/grezzi
          du -sh /home/runner/grezzi

      - name: Ritaglio sull'Italia centrale e correzione del suolo
        run: |
          bash prepara_grib.sh /home/runner/grezzi /home/runner/finali "$ORE"
          rm -rf /home/runner/grezzi
          du -sh /home/runner/finali

      - name: Salvo i dati pronti
        uses: actions/upload-artifact@v4
        with:
          name: dati-finali
          path: /home/runner/finali
          retention-days: 1

  prepara:
    needs: dati
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      corsa: ${{ needs.dati.outputs.corsa }}
    env:
      ORE: ${{ inputs.ore }}
      CORSA: ${{ needs.dati.outputs.corsa }}
      UCX_TLS: sm,self,tcp        # MPI usa solo la memoria del computer (niente InfiniBand)
    steps:
      - uses: actions/checkout@v4

      - name: Programmi necessari
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tcsh mpich \
            libnetcdf-dev libnetcdff-dev libpng-dev zlib1g-dev python3-numpy python3-netcdf4

      - name: Recupero WRF e WPS compilati per ARM
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/wrf-install
          key: wrf-arm-v1-cerca
          restore-keys: wrf-arm-v1-
          fail-on-cache-miss: true

      - name: Recupero i file del dominio
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/geo_em
          key: geo-em-cerca
          restore-keys: geo-em-
          fail-on-cache-miss: true

      - name: Recupero i dati pronti
        uses: actions/download-artifact@v4
        with:
          name: dati-finali
          path: /home/runner/finali

      - name: ungrib e metgrid
        run: |
          mkdir -p /home/runner/WPS
          cp -a /home/runner/wrf-install/WPS/. /home/runner/WPS/
          cp /home/runner/geo_em/geo_em.d0*.nc /home/runner/WPS/
          cp /home/runner/geo_em/namelist.wps /home/runner/WPS/namelist.wps
          cp Vtable.ECMWF01 /home/runner/WPS/Vtable
          cd /home/runner/WPS
          EPOCH=$(date -u -d "${CORSA:0:8} ${CORSA:8:2}:00 UTC" +%s)
          START=$(date -u -d @$EPOCH +%Y-%m-%d_%H:%M:%S)
          END=$(date -u -d @$((EPOCH + ORE*3600)) +%Y-%m-%d_%H:%M:%S)
          echo "Periodo: $START -> $END"
          sed -i "s/^ *start_date.*/ start_date = '$START','$START',/; s/^ *end_date.*/ end_date   = '$END','$END',/" namelist.wps
          rm -f GRIBFILE.* FILE:*
          ./link_grib.csh /home/runner/finali/*.grib2
          ./ungrib.exe > ungrib.log 2>&1 || true
          grep -q "Successful completion" ungrib.log || { echo "ERRORE: ungrib non e' riuscito. Ultime righe:"; tail -n 40 ungrib.log; exit 1; }
          ATTESI=$((ORE/3 + 1))
          echo "file di ungrib: $(ls FILE:* | wc -l) (attesi $ATTESI)"
          test "$(ls FILE:* | wc -l)" -eq "$ATTESI" || { echo "ERRORE: numero di istanti sbagliato"; exit 1; }
          ./metgrid.exe > metgrid.log 2>&1 || true
          grep -q "Successful completion" metgrid.log || { echo "ERRORE: metgrid non e' riuscito. Ultime righe:"; tail -n 40 metgrid.log; exit 1; }
          for d in d01 d02; do
            N=$(ls met_em.$d.* | wc -l)
            echo "met_em $d: $N (attesi $ATTESI)"
            test "$N" -eq "$ATTESI" || { echo "ERRORE: met_em $d incompleti"; exit 1; }
          done
          rm -rf /home/runner/finali FILE:*

      - name: real.exe (condizioni iniziali e al contorno)
        run: |
          mkdir -p /home/runner/run
          cd /home/runner/run
          cp -aL /home/runner/wrf-install/WRF/run/. .
          cp -L /home/runner/wrf-install/WRF/real.exe .
          ln -sf /home/runner/WPS/met_em.d0* .
          NLEV=$(python3 -c "from netCDF4 import Dataset;import glob;n=Dataset(sorted(glob.glob('met_em.d01.*'))[0]);print(len(n.dimensions['num_metgrid_levels']))")
          NSOIL=$(python3 -c "from netCDF4 import Dataset;import glob;n=Dataset(sorted(glob.glob('met_em.d01.*'))[0]);print(int(n.getncattr('NUM_METGRID_SOIL_LEVELS')))")
          echo "livelli di metgrid: $NLEV, livelli di suolo: $NSOIL"
          test "$NSOIL" -ge 1 || { echo "ERRORE: metgrid non ha trovato il suolo"; exit 1; }
          echo "$CORSA $NLEV $NSOIL" > corsa.txt
          python3 "$GITHUB_WORKSPACE/namelist.py" --corsa "$CORSA" --da 0 --a "$ORE" --nlev "$NLEV" --nsoil "$NSOIL" > namelist.input
          grep -E "run_hours|start_|end_" namelist.input | head -12
          ulimit -s unlimited || true
          export OMP_NUM_THREADS=1
          rm -f rsl.*
          set +e
          mpirun -np 1 ./real.exe > real_stdout.log 2>&1
          echo "codice di uscita di real.exe: $?"
          set -e
          if ! grep -q "SUCCESS COMPLETE REAL_EM" rsl.error.0000 2>/dev/null; then
            echo "ERRORE: real.exe non e' riuscito."
            tail -n 30 rsl.error.0000 || true
            tail -n 15 real_stdout.log || true
            exit 1
          fi
          ls -lh wrfinput_d0* wrfbdy_d01
          mkdir -p /home/runner/stato
          tar -czf /home/runner/stato/stato.tgz wrfinput_d01 wrfinput_d02 wrfbdy_d01 corsa.txt
          ls -lh /home/runner/stato

      - name: Salvo lo stato iniziale
        uses: actions/upload-artifact@v4
        with:
          name: stato-0
          path: /home/runner/stato/stato.tgz
          retention-days: 2
          compression-level: 0

      - name: Log (solo se qualcosa e' andato storto)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-prepara
          path: |
            /home/runner/run/namelist.input
            /home/runner/run/rsl.error.0000
            /home/runner/run/real_stdout.log
            /home/runner/WPS/ungrib.log
            /home/runner/WPS/metgrid.log
            /home/runner/WPS/namelist.wps
          if-no-files-found: ignore
          retention-days: 7

  blocco1:
    needs: [dati, prepara]
    uses: ./.github/workflows/blocco-wrf.yml
    with:
      corsa: ${{ needs.prepara.outputs.corsa }}
      da: 0
      a: ${{ fromJSON(needs.dati.outputs.b1) }}
      blocco: 1
      stato_in: stato-0
      stato_out: stato-1

  blocco2:
    needs: [dati, prepara, blocco1]
    if: ${{ fromJSON(needs.dati.outputs.n) >= 2 }}
    uses: ./.github/workflows/blocco-wrf.yml
    with:
      corsa: ${{ needs.prepara.outputs.corsa }}
      da: ${{ fromJSON(needs.dati.outputs.b1) }}
      a: ${{ fromJSON(needs.dati.outputs.b2) }}
      blocco: 2
      stato_in: stato-1
      stato_out: stato-2

  blocco3:
    needs: [dati, prepara, blocco2]
    if: ${{ fromJSON(needs.dati.outputs.n) >= 3 }}
    uses: ./.github/workflows/blocco-wrf.yml
    with:
      corsa: ${{ needs.prepara.outputs.corsa }}
      da: ${{ fromJSON(needs.dati.outputs.b2) }}
      a: ${{ fromJSON(needs.dati.outputs.b3) }}
      blocco: 3
      stato_in: stato-2
      stato_out: stato-3

  pubblica:
    needs: [dati, prepara, blocco1, blocco2, blocco3]
    if: ${{ always() && needs.blocco1.result == 'success' && (fromJSON(needs.dati.outputs.n) < 2 || needs.blocco2.result == 'success') && (fromJSON(needs.dati.outputs.n) < 3 || needs.blocco3.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORE: ${{ inputs.ore }}
      CORSA: ${{ needs.prepara.outputs.corsa }}
    steps:
      - uses: actions/checkout@v4

      - name: Programmi necessari
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-numpy python3-matplotlib

      - name: Scarico le uscite di tutti i blocchi
        uses: actions/download-artifact@v4
        with:
          pattern: uscite-*
          merge-multiple: true
          path: /home/runner/uscite

      - name: Controllo di plausibilita'
        run: |
          ls -lh /home/runner/uscite
          set +e
          python3 controllo.py --uscite /home/runner/uscite --ore "$ORE" --rapporto /home/runner/controllo.txt
          RC=$?
          set -e
          {
            echo "## Previsione Nerola, corsa ECMWF $CORSA, $ORE ore"
            echo '```'
            cat /home/runner/controllo.txt
            echo
            cat /home/runner/uscite/tempi_b*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Recupero confini e nomi dei paesi (dalla cache)
        id: cache-sfondo
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/sfondo
          key: sfondo-v1

      - name: Scarico confini e nomi dei paesi (solo la prima volta)
        id: sfondo
        if: steps.cache-sfondo.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          python3 sfondo.py --scarica /home/runner/sfondo
          if [ -f /home/runner/sfondo/sfondo.json ]; then echo "completo=si" >> "$GITHUB_OUTPUT"; fi

      - name: Salvo confini e nomi nella cache
        if: steps.sfondo.outputs.completo == 'si'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/sfondo
          key: sfondo-v1

      - name: Mappe e meteogramma
        run: |
          python3 mappe.py --uscite /home/runner/uscite --corsa "$CORSA" --out /home/runner/pubblico --sfondo /home/runner/sfondo
          cp /home/runner/controllo.txt /home/runner/pubblico/
          cp /home/runner/uscite/tempi_b*.txt /home/runner/pubblico/
          cat > /home/runner/pubblico/LEGGIMI.md <<EOT
          # Previsione WRF su Nerola

          Corsa ECMWF **$CORSA UTC**, $ORE ore.

          - \`mappe/1km/<parametro>/AAAAMMGG_HH.png\` e \`mappe/3km/...\`: una mappa per parametro (ora UTC nel nome del file).
          - \`indice.json\`: elenco di tutte le mappe, per le pagine web.
          - \`meteogramma_nerola.png\`: andamento nel punto di Nerola.
          - \`d01_tutto.npz\`, \`d02_tutto.npz\`: i dati.
          Confini: Natural Earth (pubblico dominio). Nomi dei paesi: GeoNames (CC BY 4.0).

          Modello WRF 4.7.0, dati di partenza e al contorno: ECMWF IFS open data 0,1 gradi
          (https://www.ecmwf.int/en/forecasts/datasets/open-data), licenza CC BY 4.0.
          Dati modificati: ritagliati sull'Italia centrale, ricodificati e usati come condizioni iniziali e al contorno di WRF.
          ECMWF non garantisce i dati e non risponde di errori o omissioni.
          Previsione sperimentale: non usare per decisioni importanti o di sicurezza.
          EOT
          du -sh /home/runner/pubblico

      - name: Pubblico nel ramo "risultati"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /home/runner/pubblico
          git init -q -b risultati
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Previsione Nerola, corsa ECMWF $CORSA, $ORE h"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" risultati
          echo "Pubblicato: https://github.com/${GITHUB_REPOSITORY}/tree/risultati"

      - name: Se il controllo ha bocciato i risultati, li tengo per guardarli
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uscite-bocciate
          path: |
            /home/runner/controllo.txt
            /home/runner/uscite/*
          if-no-files-found: ignore
          retention-days: 5
