name: "Blocco WRF"
run-name: "Blocco WRF"

# Fa girare un blocco di previsione (di solito 24 ore) su ARM e passa lo stato al blocco dopo.
# Non si lancia da solo: lo chiama "Previsione Nerola".
on:
  workflow_call:
    inputs:
      corsa:
        type: string
        required: true
      da:
        type: number
        required: true
      a:
        type: number
        required: true
      blocco:
        type: number
        required: true
      stato_in:
        type: string
        required: true
      stato_out:
        type: string
        required: true
      domini:
        description: "2 = 3 km e 1 km (normale); 3 = anche 333 m su Nerola (catena fine)"
        type: number
        default: 2
      nome_uscite:
        description: "prefisso del nome dei file delle uscite (diverso per ogni catena)"
        type: string
        default: "uscite"

jobs:
  blocco:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 345
    env:
      CORSA: ${{ inputs.corsa }}
      DA: ${{ inputs.da }}
      A: ${{ inputs.a }}
      BLOCCO: ${{ inputs.blocco }}
      NDOM: ${{ inputs.domini }}
      UCX_TLS: sm,self,tcp        # MPI usa solo la memoria del computer (niente InfiniBand)
    steps:
      - uses: actions/checkout@v4

      - name: Programmi necessari
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mpich libnetcdf-dev libnetcdff-dev python3-numpy python3-netcdf4

      - name: Recupero WRF compilato per ARM
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/wrf-install
          key: wrf-arm-v1-cerca
          restore-keys: wrf-arm-v1-
          fail-on-cache-miss: true

      - name: Recupero lo stato del blocco prima
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.stato_in }}
          path: /home/runner/stato

      - name: Preparo la cartella di calcolo
        run: |
          mkdir -p /home/runner/run
          cd /home/runner/run
          cp -aL /home/runner/wrf-install/WRF/run/. .
          cp -L /home/runner/wrf-install/WRF/wrf.exe .
          tar -xzf /home/runner/stato/stato.tgz
          ls -l
          cat corsa.txt
          test "$(cut -d' ' -f1 corsa.txt)" = "$CORSA" || { echo "ERRORE: lo stato e' di un'altra corsa"; exit 1; }

      - name: Calcolo con wrf.exe
        run: |
          cd /home/runner/run
          read C NLEV NSOIL < corsa.txt
          ulimit -s unlimited || true
          export OMP_NUM_THREADS=1
          T0=$(date +%s)
          # prima con il passo di tempo adattivo (molto piu' veloce); se fallisce, di nuovo con il passo fisso
          MODO="adattivo"
          for TENTATIVO in adattivo fisso; do
            OPZ=""; [ "$TENTATIVO" = fisso ] && OPZ="--fisso"
            python3 "$GITHUB_WORKSPACE/namelist.py" --corsa "$C" --da "$DA" --a "$A" --nlev "$NLEV" --nsoil "$NSOIL" --domini "$NDOM" $OPZ > namelist.input
            grep -E "run_hours|start_|end_|restart|adaptive" namelist.input | head -24
            rm -f rsl.*
            echo "== wrf.exe da +${DA} h a +${A} h, 4 processi, passo $TENTATIVO ($(date -u +%H:%M) UTC)"
            set +e
            mpirun -np 4 ./wrf.exe > wrf_stdout.log 2>&1
            RC=$?
            set -e
            MODO="$TENTATIVO"
            grep -q "SUCCESS COMPLETE WRF" rsl.error.0000 2>/dev/null && break
            echo "ATTENZIONE: wrf.exe con passo $TENTATIVO non riuscito"
            grep -n -i -E "fatal|error|cfl" rsl.error.0000 2>/dev/null | head -8 || true
          done
          T1=$(date +%s)
          mkdir -p /home/runner/uscite
          echo "blocco $BLOCCO: da +${DA} h a +${A} h, $((T1-T0)) secondi ($(( (T1-T0)/60 )) minuti), uscita $RC, passo $MODO" | tee /home/runner/uscite/tempi_b${BLOCCO}.txt
          if ! grep -q "SUCCESS COMPLETE WRF" rsl.error.0000 2>/dev/null; then
            echo "ERRORE: wrf.exe non e' riuscito."
            grep -n -i -E "fatal|error|cfl|segmentation|forrtl|nan" rsl.error.* 2>/dev/null | head -20 || true
            for f in rsl.error.0000 rsl.out.0000; do
              if [ -e $f ]; then echo "---- $f (ultime 30 righe) ----"; tail -n 30 $f; fi
            done
            tail -n 30 wrf_stdout.log || true
            exit 1
          fi
          echo "wrf.exe riuscito"
          ls wrfout_d0* | wc -l
          FINE=$(date -u -d "${C:0:8} ${C:8:2}:00 UTC + ${A} hours" +%Y-%m-%d_%H:%M:%S)
          for d in $(seq 1 $NDOM); do
            test -s "wrfrst_d0${d}_${FINE}" || { echo "ERRORE: manca il file di ripresa del dominio ${d} alle ${FINE}"; ls wrfrst_* 2>/dev/null || true; exit 1; }
          done
          echo "$FINE" > fine.txt

      - name: Impacchetto lo stato per il blocco dopo
        run: |
          cd /home/runner/run
          FINE=$(cat fine.txt)
          mkdir -p /home/runner/stato_out
          FILE_STATO="wrfbdy_d01 corsa.txt"
          for d in $(seq 1 $NDOM); do FILE_STATO="$FILE_STATO wrfinput_d0${d} wrfrst_d0${d}_${FINE}"; done
          tar -czf /home/runner/stato_out/stato.tgz $FILE_STATO
          ls -lh /home/runner/stato_out

      - name: Tengo solo i campi che servono (file piccoli)
        run: |
          python3 postprocess.py --run /home/runner/run --blocco "$BLOCCO" --out /home/runner/uscite --domini "$NDOM"
          ls -lh /home/runner/uscite

      - name: Salvo lo stato per il blocco dopo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.stato_out }}
          path: /home/runner/stato_out/stato.tgz
          retention-days: 2
          compression-level: 0

      - name: Salvo le uscite del blocco
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.nome_uscite }}-${{ inputs.blocco }}
          path: /home/runner/uscite/*
          retention-days: 3

      - name: Log (solo se qualcosa e' andato storto)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-blocco-${{ inputs.blocco }}
          path: |
            /home/runner/run/namelist.input
            /home/runner/run/rsl.error.0000
            /home/runner/run/rsl.out.0000
            /home/runner/run/wrf_stdout.log
          if-no-files-found: ignore
          retention-days: 7
