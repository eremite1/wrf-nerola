name: "Prova sito (temporaneo)"
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    steps:
      - name: Leggo le pagine dati del sito
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          : > esito.txt
          for u in dati-live archivio-dati dati-tecnici; do
            curl -sSL -m 60 -A "Mozilla/5.0" -o $u.html -w "$u %{http_code} %{size_download}\n" https://www.meteonerola.it/$u/ >> esito.txt 2>&1 || true
            echo "--- riferimenti in $u" >> esito.txt
            grep -oiE "(https?:)?//[^\"' )<>]*(\.json|\.txt|\.csv|realtime|clientraw|wp-json|ajax|api|dati|stazione|\.php)[^\"' )<>]*" $u.html | sort -u | grep -v "wp-includes\|emoji\|gstatic\|fonts" | head -40 >> esito.txt
            echo "--- testo $u" >> esito.txt
            sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' $u.html | tr -s ' \n\t' | head -c 1500 >> esito.txt
            echo >> esito.txt
          done
          echo "--- wp-json routes" >> esito.txt
          curl -sSL -m 60 -A "Mozilla/5.0" https://www.meteonerola.it/wp-json/ | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(d.get('routes',{}).keys()))" >> esito.txt 2>&1 || true
          echo "--- script inline della home con dati" >> esito.txt
          curl -sSL -m 60 -A "Mozilla/5.0" https://www.meteonerola.it/ | grep -oiE "(fetch|XMLHttpRequest|\.json|\.txt)[^;]{0,160}" | head -20 >> esito.txt
          cd /tmp/out && git init -q -b prova && git config user.name bot && git config user.email b@b
          git add esito.txt && git commit -q -m esito
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" prova
