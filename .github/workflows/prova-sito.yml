name: "Prova sito (temporaneo)"
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    steps:
      - name: Scarico la home
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          curl -sSL -m 60 -A "Mozilla/5.0" -o home.html https://www.meteonerola.it/
          curl -sSL -m 60 -A "Mozilla/5.0" -o consegna.txt -w "%{http_code}\n" https://www.meteonerola.it/wp-json/meteonerola/v1/consegna > esito.txt 2>&1 || true
          head -c 600 consegna.txt >> esito.txt
          git init -q -b prova && git config user.name bot && git config user.email b@b
          git add -A && git commit -q -m esito
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" prova
