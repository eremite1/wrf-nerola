name: "Prova fonti dati stazioni"
run-name: "Prova: quali fonti di osservazioni sono raggiungibili"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Provo gli indirizzi
        run: |
          exec > /tmp/esito.txt 2>&1
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 wrf-nerola"})
              return urllib.request.urlopen(r, timeout=60).read().decode("utf-8", "replace")
          for pid in ("osservazioni-idro-meteo-stazioni-al-suolo", "meteonetwork"):
              print("=== pacchetto", pid)
              try:
                  j = json.loads(get("https://dati.agenziaitaliameteo.it/api/3/action/package_show?id=" + pid))["result"]
                  print(j.get("title"), "|", (j.get("notes") or "")[:800])
                  for x in j["resources"]:
                      print("-", x.get("name"), "|", x.get("format"), "|", x.get("url"), "|", (x.get("description") or "")[:300])
              except Exception as e:
                  print("ERRORE", e)
          print("=== meteohub datasets")
          try:
              for d in json.loads(get("https://meteohub.agenziaitaliameteo.it/api/datasets")):
                  if d.get("category") != "FOR":
                      print(json.dumps(d, ensure_ascii=False)[:500])
          except Exception as e:
              print("ERRORE", e)
          print("=== temporeale")
          try:
              print(get("https://temporeale.regione.lazio.it/")[:600])
          except Exception as e:
              print("ERRORE", e)
          PY
      - name: Salvo l'esito nel ramo prova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/p && cd /tmp/p && git init -q -b prova && cp /tmp/esito.txt . && git config user.name bot && git config user.email bot@x.y
          git add -A && git commit -q -m esito && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prova
