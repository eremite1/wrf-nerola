name: "Prova fonti dati stazioni"
run-name: "Prova: pioggia MeteoHub e modelli Open-Meteo"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Programmi
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-numpy
      - name: Provo
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: |
          exec > /tmp/esito.txt 2>&1
          set +e
          python3 - <<'PY' || true
          import json, os, urllib.request, urllib.parse
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          import stazioni as S
          print("=== MeteoHub")
          r = json.loads(S.richiesta(S.BASE_MH + "/auth/login", json.dumps({"username": os.environ["METEOHUB_USERNAME"], "password": os.environ["METEOHUB_PASSWORD"]}).encode(), {"Content-Type": "application/json"}, "POST"))
          token = r if isinstance(r, str) else (r.get("token") or r.get("access_token"))
          fine = datetime.now(timezone.utc); inizio = fine - timedelta(hours=6)
          q = f"reftime: >={inizio:%Y-%m-%d %H:%M},<={fine:%Y-%m-%d %H:%M};license:CCBY_COMPLIANT"
          for rete in ("dpcn-lazio", "mnw", "dpcn-umbria"):
              par = urllib.parse.urlencode({"networks": rete, "q": q, "reliabilityCheck": "true", "lonmin": 11.3, "latmin": 41.0, "lonmax": 14.3, "latmax": 43.4})
              j = json.loads(S.richiesta(S.BASE_MH + "/api/observations?" + par, intestazioni={"Authorization": "Bearer " + token, "Accept": "application/json"}))
              c = Counter(); es = {}
              for it in j.get("data", []):
                  for p in it.get("prod", []):
                      k = (p["var"], p.get("lev"), p.get("trange"))
                      c[k] += 1; es.setdefault(k, (it["stat"].get("lat"), p.get("val", [])[:3]))
              print("--", rete, "stazioni", len(j.get("data", [])))
              for k, n in sorted(c.items(), key=lambda x: (x[0][0], -x[1])):
                  if k[0] in ("B13011", "B13019", "B13020", "B13021", "B13022", "B13023", "B12101", "B07030", "B07031"):
                      print(k, n, str(es[k])[:300])
              if j.get("data"):
                  print("esempio dettagli stazione:", json.dumps(j["data"][0]["stat"], ensure_ascii=False)[:600])
          print("=== Open-Meteo")
          modelli = "italia_meteo_arpae_icon_2i,meteofrance_arome_france_hd,ecmwf_ifs,ukmo_global_deterministic_10km,dwd_icon_eu,ecmwf_ifs025"
          u = "https://api.open-meteo.com/v1/forecast?" + urllib.parse.urlencode({"latitude": "42.13,41.9", "longitude": "12.77,12.5", "hourly": "temperature_2m,dew_point_2m,wind_speed_10m,precipitation", "models": modelli, "forecast_days": 3, "timezone": "GMT"})
          try:
              t = S.richiesta(u)
              j = json.loads(t)
              j = j if isinstance(j, list) else [j]
              print("punti", len(j))
              h = j[0]["hourly"]
              for k, v in h.items():
                  print(k, [x for x in v[:3]], "nonnulli:", sum(x is not None for x in v), "su", len(v))
          except Exception as e:
              print("ERRORE open-meteo", e, getattr(e, "read", lambda: b"")()[:300])
          PY
          true
      - name: Salvo l'esito nel ramo prova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/p && cd /tmp/p && git init -q -b prova && cp /tmp/esito.txt . && git config user.name bot && git config user.email bot@x.y
          git add -A && git commit -q -m esito && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prova
