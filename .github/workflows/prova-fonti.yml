name: "Prova fonti dati stazioni"
run-name: "Prova: quali fonti di osservazioni sono raggiungibili"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Provo gli indirizzi
        run: |
          exec > /tmp/esito.txt 2>&1
          python3 - <<'PY'
          import urllib.request, ssl
          def get(u, n=700):
              r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) wrf-nerola"})
              try:
                  b = urllib.request.urlopen(r, timeout=40).read().decode("utf-8", "replace")
                  return f"OK {len(b)} byte :: " + " ".join(b[:n].split())
              except Exception as e:
                  return "ERRORE " + str(e)[:200]
          prove = [
            "https://www.meteonetwork.it/rete/livemap/",
            "https://www.meteonetwork.it/rete/api/",
            "https://www.ogimet.com/cgi-bin/getsynop?block=16242&begin=202610300000&end=202610310000",
            "https://www.ogimet.com/cgi-bin/getsynop?block=16240&begin=202610300000&end=202610310000",
            "https://agrometeo.arsial.it/",
            "https://www.arsial.it/servizio-agrometeorologico/",
            "https://www.regione.lazio.it/cittadini/protezione-civile/centro-funzionale",
            "https://dati.lazio.it/",
            "https://www.cfumbria.it/",
            "https://api.weather.com/v2/pws/observations/current?stationId=IROMA1&format=json&units=m&apiKey=test",
            "https://www.wunderground.com/wundermap",
            "https://api.open-meteo.com/v1/forecast?latitude=42.13&longitude=12.77&current=temperature_2m",
            "https://mesonet.agron.iastate.edu/api/1/currents.json?network=IT__ASOS",
            "https://dati.protezionecivile.it/",
            "https://mappe.protezionecivile.gov.it/",
            "https://www.meteoregionelazio.it/",
            "https://temporeale.regione.lazio.it/",
          ]
          for u in prove:
              print("###", u); print(get(u)); print()
          PY
      - name: Salvo l'esito nel ramo prova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/p && cd /tmp/p && git init -q -b prova && cp /tmp/esito.txt . && git config user.name bot && git config user.email bot@x.y
          git add -A && git commit -q -m esito && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prova
