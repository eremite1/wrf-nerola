name: "Prova fonti dati stazioni"
run-name: "Prova: quali fonti di osservazioni sono raggiungibili"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Provo gli indirizzi
        run: |
          exec > /tmp/esito.txt 2>&1
          python3 - <<'PY'
          import urllib.request, re, json
          H = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) wrf-nerola"}
          def raw(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=40).read().decode("utf-8", "replace")
          j = json.loads(raw("https://dati.lazio.it/api/3/action/package_search?q=meteo&rows=20"))["result"]["results"]
          for d in j:
              print("=== ", d["name"], "|", d["title"], "|", d.get("metadata_modified"))
              for r in d["resources"]:
                  print("   -", r.get("name"), "|", r.get("format"), "|", r.get("url"))
          print("### API meteonetwork")
          try:
              t = re.sub(r"<[^>]+>", " ", raw("https://www.meteonetwork.it/supporto/meteonetwork-api/"))
              print(" ".join(t.split())[:3500])
          except Exception as e: print("ERRORE", e)
          PY
      - name: Salvo l'esito nel ramo prova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/p && cd /tmp/p && git init -q -b prova && cp /tmp/esito.txt . && git config user.name bot && git config user.email bot@x.y
          git add -A && git commit -q -m esito && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prova
