name: "Prova fonti dati stazioni"
run-name: "Prova: quali fonti di osservazioni sono raggiungibili"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Provo gli indirizzi
        run: |
          exec > /tmp/esito.txt 2>&1
          python3 - <<'PY'
          import urllib.request, re, json
          H = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) wrf-nerola"}
          def raw(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=40).read().decode("utf-8", "replace")
          def get(u, n=900):
              try:
                  b = raw(u); return f"OK {len(b)} byte :: " + " ".join(b[:n].split())
              except Exception as e:
                  return "ERRORE " + str(e)[:200]
          print("### livemap: script e indirizzi")
          try:
              h = raw("https://www.meteonetwork.it/rete/livemap/")
              for m in sorted(set(re.findall(r'(?:src|href)="([^"]+)"', h))): print(m)
              for m in sorted(set(re.findall(r"['\"](/[^'\" ]*(?:json|api|data|station)[^'\" ]*)['\"]", h))): print("PERCORSO", m)
          except Exception as e: print("ERRORE", e)
          for u in ["https://www.meteonetwork.it/rete/livemap/stations.json", "https://www.meteonetwork.it/rete/livemap/data/",
                    "https://www.meteonetwork.it/rete/livemap/json/"]:
              print("###", u); print(get(u))
          print("### CKAN Lazio")
          print(get("https://dati.lazio.it/catalog/api/3/action/package_search?q=stazioni+meteo&rows=15", 3000))
          print(get("https://dati.lazio.it/api/3/action/package_search?q=meteo&rows=15", 3000))
          print("### aegis")
          print(get("https://temporeale.regione.lazio.it/aegis", 1500))
          print("### ogimet elenco stazioni vicine")
          for b in ("16235","16239","16241","16243","16245","16246","16247","16248","16252","16215","16216","16217","16218","16219","16220"):
              r = get(f"https://www.ogimet.com/cgi-bin/getsynop?block={b}&begin=202610310000&end=202610311200", 160); print(b, r[:200])
          PY
      - name: Salvo l'esito nel ramo prova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/p && cd /tmp/p && git init -q -b prova && cp /tmp/esito.txt . && git config user.name bot && git config user.email bot@x.y
          git add -A && git commit -q -m esito && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prova
