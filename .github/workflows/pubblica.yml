name: "Pubblica la previsione WRF"
# Controllo di plausibilita', mappe, meteogramma e pubblicazione nel ramo "risultati".
# Si usa due volte per ogni corsa: appena sono pronte le prime 48 ore (cosi' sul sito arriva prima) e alla fine con
# tutte le 72 ore.
on:
  workflow_call:
    inputs:
      ore:
        type: string
        required: true
      corsa:
        type: string
        required: true
      cartella:
        description: "vuoto = catena principale (ECMWF 3 km e 1 km); altrimenti sottocartella (fine, gfs)"
        type: string
        default: ""
      forzante:
        type: string
        default: "ECMWF"
      domini:
        description: "numero di domini della catena (2 o 3)"
        type: number
        default: 2
      opzioni_mappe:
        description: "opzioni in piu' per mappe.py (es. --domini d03:300m:333 m --essenziali)"
        type: string
        default: ""
      nome_uscite:
        type: string
        default: "uscite"

permissions:
  contents: write

jobs:
  pubblica:
    concurrency:
      group: pubblica-risultati
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORE: ${{ inputs.ore }}
      CORSA: ${{ inputs.corsa }}
      CARTELLA: ${{ inputs.cartella }}
      FORZANTE: ${{ inputs.forzante }}
      NDOM: ${{ inputs.domini }}
    steps:
      - uses: actions/checkout@v4

      - name: Programmi necessari
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-numpy python3-matplotlib

      - name: Scarico le uscite di tutti i blocchi
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.nome_uscite }}-*
          merge-multiple: true
          path: /home/runner/uscite

      - name: Controllo di plausibilita'
        run: |
          ls -lh /home/runner/uscite
          set +e
          python3 controllo.py --uscite /home/runner/uscite --ore "$ORE" --rapporto /home/runner/controllo.txt --domini "$NDOM"
          RC=$?
          set -e
          {
            echo "## Previsione Nerola ${CARTELLA:-principale}, corsa $FORZANTE $CORSA, $ORE ore"
            echo '```'
            cat /home/runner/controllo.txt
            echo
            cat /home/runner/uscite/tempi_b*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Recupero confini e nomi dei paesi (dalla cache)
        id: cache-sfondo
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/sfondo
          key: sfondo-v4

      - name: Scarico confini e nomi dei paesi (solo la prima volta)
        id: sfondo
        if: steps.cache-sfondo.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pyshp python3-pyproj || pip install --break-system-packages -q pyshp pyproj
          python3 sfondo.py --scarica /home/runner/sfondo
          if [ -f /home/runner/sfondo/sfondo.json ]; then echo "completo=si" >> "$GITHUB_OUTPUT"; fi

      - name: Salvo confini e nomi nella cache
        if: steps.sfondo.outputs.completo == 'si'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/sfondo
          key: sfondo-v4

      - name: Mappe e meteogramma
        run: |
          python3 mappe.py --uscite /home/runner/uscite --corsa "$CORSA" --out /home/runner/pubblico --sfondo /home/runner/sfondo --forzante "$FORZANTE" ${{ inputs.opzioni_mappe }}
          # la pagina web si prende sempre dall'ultima versione su main (la corsa dura ore e il codice puo' essere cambiato nel frattempo)
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/pagina/index.html" -o /home/runner/pubblico/index.html || cp pagina/index.html /home/runner/pubblico/index.html
          cp pagina/sondaggi.html pagina/colonna.html pagina/comune.js /home/runner/pubblico/
          touch /home/runner/pubblico/.nojekyll
          cp /home/runner/controllo.txt /home/runner/pubblico/
          cp /home/runner/uscite/tempi_b*.txt /home/runner/pubblico/
          cat > /home/runner/pubblico/LEGGIMI.md <<EOT
          # Previsione WRF su Nerola

          Corsa $FORZANTE **$CORSA UTC**, $ORE ore${CARTELLA:+ (catena $CARTELLA)}.

          - \`mappe/1km/<parametro>/AAAAMMGG_HH.png\` e \`mappe/3km/...\`: una mappa per parametro (ora UTC nel nome del file).
          - \`index.html\`: la pagina web (con \`indice.json\`, l'elenco di tutte le mappe).
          - \`sondaggi.html\`: radiosondaggi virtuali (WRF + modelli di Mappe Lazio), dati in \`dati/<dominio>/sondaggi.bin\`.
          - \`meteogramma_nerola.png\`: andamento nel punto di Nerola.
          - \`d01_tutto.npz\`, \`d02_tutto.npz\`: i dati.
          Confini: Natural Earth (pubblico dominio). Nomi dei paesi: GeoNames (CC BY 4.0).

          Modello WRF 4.7.0, dati di partenza e al contorno: ECMWF IFS open data 0,1 gradi
          (https://www.ecmwf.int/en/forecasts/datasets/open-data), licenza CC BY 4.0.
          Dati modificati: ritagliati sull'Italia centrale, ricodificati e usati come condizioni iniziali e al contorno di WRF.
          ECMWF non garantisce i dati e non risponde di errori o omissioni.
          Previsione sperimentale: non usare per decisioni importanti o di sicurezza.
          EOT
          du -sh /home/runner/pubblico

      - name: Pubblico nel ramo "risultati"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          RAMO=/home/runner/ramo
          rm -rf "$RAMO" && mkdir -p "$RAMO"
          # contenuto attuale del ramo (serve per non cancellare le altre catene)
          ( cd "$RAMO" && git init -q && git fetch -q --depth 1 "$REMOTO" risultati && git archive FETCH_HEAD | tar -x ) || echo "ramo risultati vuoto"
          rm -rf "$RAMO/.git"
          SOTTO="$RAMO${CARTELLA:+/$CARTELLA}"
          GIA=$(grep -o '[0-9]\{10\}' "$SOTTO/LEGGIMI.md" 2>/dev/null | head -n 1 || true)
          if [ -n "$GIA" ] && [ "$GIA" -gt "$CORSA" ] 2>/dev/null; then
            echo "Online c'e' gia' la corsa $GIA, piu' recente di $CORSA: non la sostituisco."
            exit 0
          fi
          if [ -z "$CARTELLA" ]; then
            # catena principale: sostituisco tutto tranne le sottocartelle delle altre catene
            for c in fine gfs iconeu icon2i; do [ -d "$RAMO/$c" ] && mv "$RAMO/$c" "/home/runner/tieni_$c"; done
            rm -rf "$RAMO" && cp -a /home/runner/pubblico "$RAMO"
            for c in fine gfs iconeu icon2i; do [ -d "/home/runner/tieni_$c" ] && mv "/home/runner/tieni_$c" "$RAMO/$c"; done
          else
            # altra catena: solo la sua sottocartella (la pagina e i file comuni restano quelli della principale)
            rm -rf "$SOTTO" && mkdir -p "$SOTTO"
            cp -a /home/runner/pubblico/. "$SOTTO/"
            rm -f "$SOTTO/index.html" "$SOTTO/sondaggi.html" "$SOTTO/colonna.html" "$SOTTO/comune.js" "$SOTTO/.nojekyll"
            [ -f "$RAMO/index.html" ] || cp pagina/index.html pagina/sondaggi.html pagina/colonna.html pagina/comune.js "$RAMO/"
            touch "$RAMO/.nojekyll"
          fi
          cd "$RAMO"
          git init -q -b risultati
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Previsione Nerola ${CARTELLA:-principale}, corsa $FORZANTE $CORSA, $ORE h"
          git push -q -f "$REMOTO" risultati
          echo "Pubblicato: https://github.com/${GITHUB_REPOSITORY}/tree/risultati${CARTELLA:+/$CARTELLA}"

      - name: Se il controllo ha bocciato i risultati, li tengo per guardarli
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uscite-bocciate
          path: |
            /home/runner/controllo.txt
            /home/runner/uscite/*
          if-no-files-found: ignore
          retention-days: 5
