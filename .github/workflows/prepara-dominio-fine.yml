name: Prepara dominio a 333 m
# Come prepara-dominio.yml ma con il terzo dominio (333 m, circa 20 km intorno a Nerola) per la catena fine.
# Salva nella cache 'dominio3-...' (diversa da quella della catena principale).

on:
  workflow_dispatch:

jobs:
  dominio:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Installa i programmi necessari
        run: |
          for i in 1 2 3 4; do sudo apt-get update -qq --error-on=any -o Acquire::Retries=5 && break; echo "server dei programmi non raggiungibile, riprovo"; sleep 45; done
          sudo apt-get install -y -o Acquire::Retries=5 libnetcdf-dev libnetcdff-dev libpng-dev zlib1g-dev \
            python3-numpy python3-matplotlib python3-netcdf4

      - name: Recupera WPS compilato (ARM, lo stesso della previsione)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/wrf-install
          key: wrf-arm-v1-cerca
          restore-keys: wrf-arm-v1-
          fail-on-cache-miss: true

      - name: Prepara WPS
        run: |
          mkdir -p /home/runner/WPS
          cp -a /home/runner/wrf-install/WPS/. /home/runner/WPS/
          ls -l /home/runner/WPS/*.exe

      - name: Scarica i dati geografici (grandi, può richiedere molto tempo)
        run: |
          mkdir -p /home/runner/geog
          cd /home/runner/geog
          curl -L --fail --retry 3 -o geog.tar.gz https://www2.mmm.ucar.edu/wrf/src/wps_files/geog_high_res_mandatory.tar.gz
          ls -lh geog.tar.gz
          tar -xzf geog.tar.gz
          rm geog.tar.gz
          find . -maxdepth 2 -type d | head -40
          df -h / | tail -1

      - name: Scrivi la configurazione del dominio (Nerola)
        run: |
          GEOG=$(find /home/runner/geog -maxdepth 3 -type d -name topo_gmted2010_30s | head -1 | xargs dirname)
          echo "Dati geografici in: $GEOG"
          test -n "$GEOG" || { echo "ERRORE: dati geografici non trovati"; exit 1; }
          cd /home/runner/WPS
          cat > namelist.wps <<EOF
          &share
           wrf_core = 'ARW',
           max_dom = 3,
           start_date = '2026-10-22_00:00:00','2026-10-22_00:00:00','2026-10-22_00:00:00',
           end_date   = '2026-10-22_00:00:00','2026-10-22_00:00:00','2026-10-22_00:00:00',
           interval_seconds = 10800,
           io_form_geogrid = 2,
          /
          &geogrid
           parent_id         = 1, 1, 2,
           parent_grid_ratio = 1, 3, 3,
           i_parent_start    = 1, 29, 27,
           j_parent_start    = 1, 29, 27,
           e_we              = 81, 73, 61,
           e_sn              = 81, 73, 61,
           geog_data_res     = 'default','default','default',
           dx = 3000,
           dy = 3000,
           map_proj  = 'lambert',
           ref_lat   = 42.13,
           ref_lon   = 12.77,
           truelat1  = 40.0,
           truelat2  = 44.0,
           stand_lon = 12.77,
           geog_data_path = '$GEOG',
          /
          &ungrib
           out_format = 'WPS',
           prefix = 'FILE',
          /
          &metgrid
           fg_name = 'FILE',
           io_form_metgrid = 2,
          /
          EOF
          cat namelist.wps

      - name: Esegui geogrid (crea la griglia del dominio)
        run: |
          cd /home/runner/WPS
          ./geogrid.exe > geogrid.log 2>&1 || true
          grep -q "Successful completion" geogrid.log || { echo "ERRORE geogrid, ultime righe:"; tail -n 40 geogrid.log; exit 1; }
          tail -n 5 geogrid.log
          ls -lh geo_em.d0*.nc

      - name: Rilievo vero a 30 m nel dominio a 333 m
        run: |
          sudo apt-get install -y -qq -o Acquire::Retries=5 python3-pil python3-requests
          cd /home/runner/WPS
          PYTHONPATH="$GITHUB_WORKSPACE" python3 "$GITHUB_WORKSPACE/rilievo_fine.py" geo_em.d03.nc

      - name: Disegna la mappa del dominio
        run: |
          mkdir -p /home/runner/geo_em
          cp /home/runner/WPS/geo_em.d0*.nc /home/runner/WPS/namelist.wps /home/runner/geo_em/
          cd /home/runner/geo_em
          python3 - <<'EOF'
          import netCDF4, numpy as np
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          fig, ax = plt.subplots(figsize=(9, 8))
          im = None
          for d in ("d01", "d02", "d03"):
              nc = netCDF4.Dataset("geo_em." + d + ".nc")
              lon = nc["XLONG_M"][0]
              lat = nc["XLAT_M"][0]
              h = nc["HGT_M"][0]
              im = ax.pcolormesh(lon, lat, h, cmap="terrain", vmin=0, vmax=2500, shading="auto")
              bx = [lon[0, 0], lon[0, -1], lon[-1, -1], lon[-1, 0], lon[0, 0]]
              by = [lat[0, 0], lat[0, -1], lat[-1, -1], lat[-1, 0], lat[0, 0]]
              ax.plot(bx, by, color={"d02": "red", "d03": "blue"}.get(d, "black"), linewidth=1.5)
              print(d, "punti:", h.shape, "quota min/max (m):", float(h.min()), float(h.max()))
          ax.plot([12.77], [42.13], "k*", markersize=14)
          ax.annotate("Nerola", (12.77, 42.13), textcoords="offset points", xytext=(8, 8))
          ax.set_aspect(1.0 / np.cos(np.radians(42.1)))
          ax.set_xlabel("Longitudine")
          ax.set_ylabel("Latitudine")
          ax.set_title("Domini WRF: 3 km (nero), 1 km (rosso) e 333 m (blu), centrati su Nerola")
          fig.colorbar(im, label="Quota (m)")
          fig.savefig("mappa_domini.png", dpi=110, bbox_inches="tight")
          EOF
          ls -lh /home/runner/geo_em

      - name: Salva i file del dominio (cache)
        uses: actions/cache/save@v4
        with:
          path: /home/runner/geo_em
          key: dominio3-${{ github.run_id }}

      - name: Salva mappa e file scaricabili
        uses: actions/upload-artifact@v4
        with:
          name: dominio-nerola-333m
          path: /home/runner/geo_em
          retention-days: 30
