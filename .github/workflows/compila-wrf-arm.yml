name: "Compila WRF su ARM"
run-name: "Compilazione WRF e WPS su ARM"

on:
  workflow_dispatch:

jobs:
  compila:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    env:
      WRF_TAG: v4.7.0
      WPS_TAG: v4.7.0
      SRC: /home/runner/wrf-src
      INSTALL: /home/runner/wrf-install
      JAS: /home/runner/jasper
      NC: /home/runner/netcdf-combinato
    steps:
      - name: Programmi di sistema
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gfortran gcc g++ make m4 csh perl file \
            mpich libmpich-dev \
            libnetcdf-dev libnetcdff-dev netcdf-bin \
            libpng-dev zlib1g-dev cmake git

      - name: Recupero il sorgente già compilato (se c'è)
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/wrf-src
            /home/runner/jasper
          key: wrf-src-arm-v1-nessuna
          restore-keys: wrf-src-arm-v1-

      - name: JasPer (lettore del formato GRIB2)
        run: |
          mkdir -p "$SRC"; cd "$SRC"
          if [ -f "$JAS/.fatto" ]; then echo "JasPer già pronto"; exit 0; fi
          rm -rf jasper jasper-build
          git clone -q --depth 1 --branch version-2.0.33 https://github.com/jasper-software/jasper.git jasper
          cmake -S jasper -B jasper-build -DCMAKE_INSTALL_PREFIX="$JAS" -DJAS_ENABLE_SHARED=OFF \
            -DJAS_ENABLE_PROGRAMS=OFF -DJAS_ENABLE_DOC=OFF -DJAS_ENABLE_LIBJPEG=OFF \
            -DJAS_ENABLE_OPENGL=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON > jasper-cmake.log 2>&1 \
            || { tail -n 40 jasper-cmake.log; exit 1; }
          cmake --build jasper-build -j 4 > jasper-build.log 2>&1 || { tail -n 40 jasper-build.log; exit 1; }
          cmake --install jasper-build > jasper-install.log 2>&1 || { tail -n 40 jasper-install.log; exit 1; }
          touch "$JAS/.fatto"
          find "$JAS" -name 'libjasper.a' | head -n1

      - name: Scarico i sorgenti di WRF e WPS
        run: |
          cd "$SRC"
          [ -d WRF ] || git clone -q --depth 1 --branch "$WRF_TAG" https://github.com/wrf-model/WRF.git WRF
          [ -d WPS ] || git clone -q --depth 1 --branch "$WPS_TAG" https://github.com/wrf-model/WPS.git WPS
          ls

      - name: Cartella netCDF unita (percorso giusto per ARM)
        run: |
          MULTI=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          echo "cartella librerie di sistema: /usr/lib/$MULTI"
          mkdir -p "$NC/include" "$NC/lib"
          ln -sf /usr/include/netcdf* "$NC/include/"
          ln -sf /usr/lib/$MULTI/libnetcdf* "$NC/lib/"
          test -n "$(ls "$NC/lib" | head -n1)" || { echo "librerie netCDF non trovate"; exit 1; }

      - name: WRF configure
        run: |
          export NETCDF="$NC" NETCDF_classic=1 WRFIO_NCD_LARGE_FILE_SUPPORT=1
          cd "$SRC/WRF"
          if [ -s main/wrf.exe ] && [ -s main/real.exe ]; then echo "WRF già compilato: salto"; exit 0; fi
          OPT=$(timeout 60 ./configure < /dev/null 2>/dev/null | grep -E 'GNU \(gfortran/gcc\)' | grep -oP '\d+(?=\.\s+\(dmpar\))' | head -n1 || true)
          echo "opzione trovata: '${OPT}'"
          if [ -z "$OPT" ]; then OPT=34; fi
          echo "uso l'opzione $OPT"
          printf "%s\n1\n" "$OPT" | timeout 300 ./configure > configure.log 2>&1 || { tail -n 40 configure.log; exit 1; }
          sed -i -E 's/^(DM_FC[[:space:]]*=[[:space:]]*mpif90)/\1 -fno-lto/; s/^(DM_CC[[:space:]]*=[[:space:]]*mpicc)/\1 -fno-lto/' configure.wrf
          grep -E '^(DM_FC|DM_CC)' configure.wrf
          test "$(grep -c -E '^DM_(FC|CC).*-fno-lto' configure.wrf)" = 2 || { echo "non riesco ad aggiungere -fno-lto"; exit 1; }

      - name: WRF compile (la parte lunga, circa 25 minuti)
        run: |
          export NETCDF="$NC" NETCDF_classic=1 WRFIO_NCD_LARGE_FILE_SUPPORT=1
          cd "$SRC/WRF"
          for T in 1 2; do
            if [ -s main/wrf.exe ] && [ -s main/real.exe ]; then break; fi
            timeout 10000 ./compile -j 4 em_real > compile.log 2>&1 || true
          done
          ls -la main/wrf.exe main/real.exe || { echo "COMPILAZIONE DI WRF FALLITA"; tail -n 40 compile.log; grep -n -m 10 -iE "error|undefined reference" compile.log; exit 1; }

      - name: Salvo subito il sorgente compilato (così non si rifà)
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/wrf-src
            /home/runner/jasper
          key: wrf-src-arm-v1-${{ github.run_id }}

      - name: WPS configure e compile
        run: |
          export NETCDF="$NC" NETCDF_classic=1
          export JASPERLIB=$(dirname "$(find "$JAS" -name libjasper.a | head -n1)") JASPERINC="$JAS/include"
          export WRF_DIR="$SRC/WRF"
          cd "$SRC/WPS"
          if [ -s geogrid.exe ] && [ -s ungrib.exe ] && [ -s metgrid.exe ]; then echo "WPS già compilato"; exit 0; fi
          # WPS non conosce ARM: aggiungo "aarch64" alla riga di descrizione di gfortran
          sed -i 's/^#ARCH    Linux x86_64, gfortran /#ARCH    Linux x86_64 aarch64, gfortran /' arch/configure.defaults
          grep -n "aarch64" arch/configure.defaults || { echo "modifica a configure.defaults non riuscita"; exit 1; }
          timeout 60 ./configure < /dev/null 2>/dev/null | head -n 30 || true
          OPT=$(timeout 60 ./configure < /dev/null 2>/dev/null | grep -E 'gfortran +\(serial\)' | grep -oP '^\s*\K\d+' | head -n1 || true)
          echo "opzione WPS: '${OPT}'"
          [ -n "$OPT" ] || { echo "nessuna opzione trovata per WPS"; exit 1; }
          echo "$OPT" | timeout 120 ./configure > configure.log 2>&1 || { tail -n 40 configure.log; exit 1; }
          timeout 3000 ./compile > compile.log 2>&1 || true
          for E in geogrid.exe ungrib.exe metgrid.exe; do
            test -s "$E" || { echo "WPS: manca $E"; tail -n 60 compile.log; exit 1; }
          done
          echo "WPS compilato"

      - name: Impacchetto quello che serve
        run: |
          rm -rf "$INSTALL"
          mkdir -p "$INSTALL/WRF/run" "$INSTALL/WPS/geogrid" "$INSTALL/WPS/metgrid" "$INSTALL/WPS/ungrib/Variable_Tables"
          cp -L "$SRC/WRF/main/wrf.exe" "$SRC/WRF/main/real.exe" "$INSTALL/WRF/"
          cp -aL "$SRC/WRF/run/." "$INSTALL/WRF/run/"
          rm -f "$INSTALL"/WRF/run/*.exe "$INSTALL"/WRF/run/namelist.input
          cp -L "$SRC"/WPS/{geogrid,ungrib,metgrid}.exe "$SRC/WPS/link_grib.csh" "$INSTALL/WPS/"
          cp -L "$SRC/WPS/geogrid/GEOGRID.TBL.ARW" "$INSTALL/WPS/geogrid/GEOGRID.TBL"
          cp -L "$SRC/WPS/metgrid/METGRID.TBL.ARW" "$INSTALL/WPS/metgrid/METGRID.TBL"
          cp -L "$SRC/WPS/ungrib/Variable_Tables/Vtable.GFS" "$INSTALL/WPS/ungrib/Variable_Tables/"
          du -sh "$INSTALL"
          echo "ESITO: wrf.exe, real.exe, geogrid, ungrib, metgrid tutti presenti"

      - name: Salvo il WRF compilato per ARM
        uses: actions/cache/save@v4
        with:
          path: /home/runner/wrf-install
          key: wrf-arm-v1-${{ github.run_id }}

      - name: Log (solo se qualcosa va storto)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilazione-arm
          path: |
            /home/runner/wrf-src/WRF/compile.log
            /home/runner/wrf-src/WRF/configure.log
            /home/runner/wrf-src/WPS/compile.log
            /home/runner/wrf-src/WPS/configure.log
          if-no-files-found: ignore
          retention-days: 7
